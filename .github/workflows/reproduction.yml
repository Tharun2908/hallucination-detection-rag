name: CPU reproduction

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-judge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check offline judge persistence and Windows process locks
        run: python -S -m unittest discover -s tests -p "test_llm_judge*.py" -v
  cached-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU analysis dependencies
        run: python -m pip install numpy==1.26.4 scikit-learn==1.5.2
      - name: Check reproduction and offline post-thesis judge contracts
        run: python -m unittest discover -s tests -v
