name: CPU reproduction

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-judge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check offline judge persistence and Windows process locks
        run: python -S -m unittest discover -s tests -p "test_llm_judge*.py" -v
      - name: Install isolated HTTP client
        run: python -m pip install -r post_thesis/llm_judge/requirements-client.txt
      - name: Check vLLM HTTP contract with offline responses
        run: python -m unittest discover -s tests -p test_vllm_backend.py -v
      - name: Check token-only pilot audit with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_token_audit.py -v
      - name: Check bounded pilot execution with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_pilot_execution.py -v
      - name: Check bounded synthetic diagnostic with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_diagnostic.py -v
  cached-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU analysis dependencies
        run: python -m pip install numpy==1.26.4 scikit-learn==1.5.2 -r post_thesis/llm_judge/requirements-client.txt -r post_thesis/llm_judge/requirements-data.txt
      - name: Check reproduction and offline post-thesis judge contracts
        run: python -m unittest discover -s tests -v
