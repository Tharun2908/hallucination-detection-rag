name: CPU reproduction

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-judge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check offline judge persistence and Windows process locks
        run: python -S -m unittest discover -s tests -p "test_llm_judge*.py" -v
      - name: Install isolated HTTP client
        run: python -m pip install -r post_thesis/llm_judge/requirements-client.txt
      - name: Check vLLM HTTP contract with offline responses
        run: python -m unittest discover -s tests -p test_vllm_backend.py -v
      - name: Check bounded class-score transport and replay with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_label_live.py -v
      - name: Check separate reserved TRAIN scoring arms with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_development_scoring.py -v
      - name: Check token-only pilot audit with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_token_audit.py -v
      - name: Check evidence TRAIN token audit with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_evidence_pilot_audit.py -v
      - name: Check bounded evidence TRAIN scoring with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_evidence_pilot.py -v
      - name: Check bounded pilot execution with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_pilot_execution.py -v
      - name: Check bounded synthetic diagnostic with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_diagnostic.py -v
      - name: Check binary-only diagnostic with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_binary_diagnostic.py -v
      - name: Check bounded binary TRAIN pilot with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_binary_pilot.py -v
      - name: Check bounded evidence diagnostic with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_evidence_execution.py -v
      - name: Check bounded schema-v2 evidence execution with offline responses
        run: python -m unittest discover -s tests -p test_llm_judge_evidence_v2_execution.py -v
      - name: Check paired evidence prompts with offline HTTP responses
        run: python -m unittest discover -s tests -p test_llm_judge_evidence_pair.py -v
      - name: Check bounded verdict-first execution and raw response ordering
        run: python -m unittest discover -s tests -p test_llm_judge_evidence_v3_execution.py -v
      - name: Check evidence schema dependencies against standard validator
        run: |
          python -m pip install -r post_thesis/llm_judge/requirements-schema.txt
          python -m unittest discover -s tests -p test_llm_judge_evidence_schema_v2.py -v
      - name: Check verdict-first identity and HTTP ordering without generation
        run: python -m unittest discover -s tests -p test_llm_judge_evidence_order_v3.py -v
  cached-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU analysis dependencies
        run: python -m pip install numpy==1.26.4 scikit-learn==1.5.2 -r post_thesis/llm_judge/requirements-client.txt -r post_thesis/llm_judge/requirements-data.txt -r post_thesis/llm_judge/requirements-schema.txt
      - name: Check reproduction and offline post-thesis judge contracts
        run: python -m unittest discover -s tests -v
